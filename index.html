<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>تقويم نوابغ المستقبل</title>
<meta name="description" content="جدول برنامج نوابغ المستقبل لأولياء الأمور: عرض يومي وأسبوعي وشهري لكل مرحلة، مع أداة تعديل ونشر للمدرسة.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap">
<style id="css">
:root{
  --ink:#173a4d;--ink2:#1f4d63;--muted:#5d707c;--page:#eef4f8;--card:#ffffff;--line:#e1eaf0;--line2:#cfdde6;
  --blue:#1b9dd9;--blue-d:#0f6ea0;--teal:#16a6bd;--soft:#e4f3fc;--coral:#f2794d;--coral-d:#d1502a;--danger:#c93a2b;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{direction:rtl;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;min-height:100vh}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #86cdf0;outline-offset:2px}
img{max-width:100%}
h1,h2,h3{font-family:"Cairo","Tajawal",sans-serif;text-wrap:balance}
.ic{width:24px;height:24px;flex:0 0 auto;display:block}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.bm{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.bm img{height:44px;width:auto;display:block}
.bm b{display:block;font-family:"Cairo",sans-serif;font-weight:800;font-size:16px;line-height:1.25}
.bm span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.seg{display:flex;gap:2px;background:#edf3f7;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-family:"Cairo",sans-serif;font-weight:700;font-size:14px;color:#4a6474;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--blue-d)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px rgba(18,60,90,.16)}
.seg .ic{width:17px;height:17px}
.seg.small button{padding:6px 11px;font-size:13px}
.seg.full{width:100%}
.seg.full button{flex:1}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 0 auto}
@media (max-width:760px){
  .stages{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .stages button{flex:1 0 auto}
  .views{order:4;width:100%}
  .views button{flex:1}
  .bm span{display:none}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-family:"Cairo",sans-serif;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#9fc9df;background:#f7fbfe}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover:not(:disabled){background:#1289c2;border-color:#1289c2}
.btn.warn{color:var(--danger)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:#b02f22;border-color:#b02f22}
.btn:disabled{opacity:.45}
.btn .ic{width:17px;height:17px}
.btn.sm{padding:6px 10px;font-size:13px}
.iconbtn{width:40px;height:40px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;color:var(--ink);padding:0}
.iconbtn:hover:not(:disabled){border-color:#9fc9df;background:#f7fbfe}
.iconbtn:disabled{opacity:.35}
.iconbtn .ic{width:20px;height:20px}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.warn{color:var(--danger)}
.pill{display:inline-block;background:var(--soft);color:var(--blue-d);font-family:"Cairo",sans-serif;font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px}
.muted{color:var(--muted);font-size:13px}
.help{color:var(--muted);font-size:12.5px;margin:0;line-height:1.6}

/* ---------- edit strip ---------- */
.editbar{background:#fff8e8;border-bottom:1px solid #f1dfb3}
.editbar .in{max-width:1480px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.editbar .lbl{display:flex;align-items:center;gap:6px;font-family:"Cairo",sans-serif;font-weight:800;color:#8a5a00;margin-inline-end:auto}
.editbar .lbl .ic{width:18px;height:18px}
.editbar em{font-style:normal;font-weight:600;color:#b4710b;font-size:13px}

/* ---------- page ---------- */
.main{max-width:1480px;margin:0 auto;padding:18px 16px 36px}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.nt{min-width:0}
.nt .title{font-family:"Cairo",sans-serif;font-weight:800;font-size:21px;line-height:1.35}
.nt .sub{color:var(--muted);font-size:13.5px}
.nav .spacer{flex:1}
.etools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;padding:10px 12px;background:#fff;border:1px dashed #c9dbe6;border-radius:14px}
.etools .hint{color:var(--muted);font-size:13px;margin-inline-end:auto}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef8fe;border:1px solid #bfe3f4;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.notice .ic{width:20px;height:20px;color:var(--blue-d)}
.notice span{margin-inline-end:auto}
.empty-state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 20px;text-align:center}
.empty-state p{margin:0 0 14px;font-family:"Cairo",sans-serif;font-weight:700;font-size:17px;color:#3c5766}
.foot{max-width:1480px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- poster (week table) ---------- */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 12px}
.poster{position:relative;overflow:hidden;background:#fff;border-radius:26px;padding:18px 20px 20px;box-shadow:0 16px 44px rgba(24,64,90,.12)}
.poster::before{content:"";position:absolute;left:0;right:0;top:0;height:160px;pointer-events:none;opacity:.6;background:radial-gradient(220px 120px at 8% 0%,#d7f0ff 0%,transparent 70%),radial-gradient(240px 130px at 30% 0%,#ffe6d3 0%,transparent 70%),radial-gradient(260px 130px at 70% 0%,#e7e0fb 0%,transparent 70%),radial-gradient(220px 120px at 94% 0%,#d9f3e7 0%,transparent 70%)}
.p-brand{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 6px 16px}
.p-brand>*{flex:0 0 auto}
.p-brand .bl img{display:block;width:auto}
.p-brand .bt{font-family:"Cairo",sans-serif;font-weight:900;font-size:28px;color:var(--coral)}
.tagline{max-width:210px;color:#3c5766;font-weight:500;font-size:13px;line-height:1.55;border-inline-start:3px solid #bfe3f4;padding-inline-start:10px;white-space:pre-line}
.p-title{flex:1 1 auto;display:flex;justify-content:center}
.p-title>div{background:linear-gradient(180deg,var(--tb1,#eaf7fe),var(--tb2,#d7eefb));border:1px solid var(--tbb,#c3e6f7);border-radius:22px;padding:12px 40px;text-align:center;min-width:330px}
.p-title h2{margin:0;font-weight:900;font-size:34px;line-height:1.35;color:var(--pt,var(--blue-d))}
.p-title .stage{display:inline-block;margin-top:4px;background:var(--pst,var(--teal));color:#fff;font-family:"Cairo",sans-serif;font-weight:700;font-size:16px;padding:4px 22px;border-radius:20px}
.p-title .dates{display:block;margin-top:6px;font-size:12.5px;color:#4b7a93;font-weight:500}
.partners{display:flex;align-items:center;gap:22px}
.partners img{display:block;width:auto}
.p-brand img,.bm img{mix-blend-mode:multiply}
.poster.snap{box-shadow:none}
.poster.snap::before{display:none}
.pgrid{position:relative;display:grid;gap:9px}
.cap{height:36px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:"Cairo",sans-serif;font-weight:800;color:#fff}
.cap.day{background:var(--pd,var(--blue));font-size:17px}
.cap.prog{background:linear-gradient(90deg,var(--pp1,var(--teal)),var(--pp2,var(--blue)));font-size:18px}
.cap.memo{background:var(--pm,var(--coral));font-size:16px}
.cell{position:relative;min-height:84px;padding:9px 8px;background:#fbfdff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.cell .ics{display:flex;gap:8px;align-items:center}
.cell .ic{width:27px;height:27px}
.cell .txt{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell .n{font-family:"Cairo",sans-serif;font-weight:700;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.cell .d{font-size:12px;font-weight:500;line-height:1.4;color:#d9432f}
.cell .t{font-family:"Cairo",sans-serif;font-weight:900;font-size:18px;line-height:1.1;color:#16849b}
.cell.wide{flex-direction:row;gap:12px;background:linear-gradient(90deg,#eafaff,#f2fbf6);border-color:#d5eef7}
.cell.wide .n{font-size:20px;font-weight:800;color:#127a9a}
.cell.wide .ic{width:28px;height:28px}
.cell.empty{background:#f5f9fb;border-style:dashed}
.cell.dayc{background:linear-gradient(180deg,#f3fbff,#e7f5fd);border-color:#cfe9f7;gap:0}
.cell.dayc span{font-family:"Cairo",sans-serif;font-weight:900;font-size:19px;color:var(--pt,var(--blue-d));line-height:1.3}
.cell.dayc small{font-size:11.5px;color:#5b87a0;font-weight:500}
.cell.dayc.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cell.memo{gap:6px}
.m1{font-size:12px;font-weight:500;line-height:1.45;color:#4a6270}
.m2{font-family:"Cairo",sans-serif;font-weight:700;font-size:12.5px;line-height:1.4;color:var(--ink2)}
.badge{display:inline-block;background:#fdece4;color:var(--coral-d);font-family:"Cairo",sans-serif;font-weight:700;font-size:11.5px;padding:3px 12px;border-radius:12px}
.cell .add{font-family:"Cairo",sans-serif;font-weight:700;font-size:13px;color:#7fa3b6}
.editing .cell[data-act]{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.editing .cell[data-act]:hover,.editing .cell[data-act]:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px #cbe9f8;outline:0}

/* ---------- day cards ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.dcard>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#e8f5fd,#f5fbff);border-bottom:1px solid #e3f0f7}
.dcard>header b{font-family:"Cairo",sans-serif;font-weight:800;font-size:17px;color:var(--blue-d)}
.dcard>header span{font-size:12.5px;color:var(--muted)}
.dcard.today{border-color:#8fcdee;box-shadow:0 0 0 3px #dff1fb}
.items{list-style:none;margin:0;padding:4px 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #eef3f6}
.item:last-child{border-bottom:0}
.item.none{color:var(--muted);justify-content:center;padding:18px 0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.ib .ic{width:23px;height:23px}
.it{display:flex;flex-direction:column;min-width:0}
.it .n{font-family:"Cairo",sans-serif;font-weight:700;font-size:14.5px;line-height:1.4;color:var(--ink2)}
.it .d{font-size:13px;color:#c93f2c;line-height:1.4}
.item .t{margin-inline-start:auto;font-family:"Cairo",sans-serif;font-weight:800;font-size:14px;color:#16849b;white-space:nowrap}
.memo-card{display:flex;gap:10px;align-items:flex-start;margin:4px 12px 12px;padding:10px 12px;background:#fff6f1;border:1px solid #fde0d2;border-radius:12px;font-size:13px;line-height:1.6}
.memo-card .ic{width:22px;height:22px;margin-top:2px}
.memo-card b{display:block;font-family:"Cairo",sans-serif;font-weight:800;color:var(--coral-d);font-size:13.5px}
.memo-card .ml{font-family:"Cairo",sans-serif;font-weight:700;color:var(--ink2)}
.memo-card .mw{color:#4a6270}
.memo-card .badge{margin-top:4px}
.dcard.big{max-width:760px;margin:0 auto}
.dcard.big .items{padding:8px 16px}
.dcard.big .item{padding:14px 2px}
.dcard.big .ib{width:50px;height:50px;border-radius:14px}
.dcard.big .ib .ic{width:27px;height:27px}
.dcard.big .it .n{font-size:16.5px}
.dcard.big .it .d{font-size:14px}
.dcard.big .item .t{font-size:16px}
.dcard.big .memo-card{margin:6px 16px 16px;font-size:14px;padding:14px 16px}

/* ---------- month ---------- */
.month{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{padding:9px 4px;text-align:center;font-family:"Cairo",sans-serif;font-weight:700;font-size:13px;color:#46606f;background:#f3f8fb;border-bottom:1px solid var(--line)}
.mhead div.off{color:#9aabb6}
.mhead .short{display:none}
.mcell{appearance:none;-webkit-appearance:none;margin:0;border:0;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);border-radius:0;background:#fff;min-height:124px;padding:7px 7px 8px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;text-align:start;min-width:0;font:inherit;color:inherit}
.mgrid>:nth-child(7n+1){border-inline-start:0}
button.mcell:hover{background:#f6fbfe}
.mcell.off{background:#f6f8fa}
.mcell.blank{background:#fbfcfd}
.mcell.nodata .dn{color:#8aa0ad}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.dn{font-family:"Cairo",sans-serif;font-weight:800;font-size:16px;line-height:1;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto}
.dn.now{background:var(--blue);color:#fff}
.hj{font-size:11px;color:#8a9ca8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk{font-family:"Cairo",sans-serif;font-weight:700;font-size:10.5px;color:#0f7f91;background:#e3f5f8;border-radius:6px;padding:1px 6px;align-self:flex-start;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:4px;border-radius:7px;padding:2px 5px;font-size:11.5px;font-weight:500;line-height:1.35;min-width:0;color:var(--ink2)}
.chip .ic{width:14px;height:14px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.more{font-size:11px;color:var(--muted);padding-inline-start:4px}
.legend{color:var(--muted);font-size:12.5px;margin:10px 2px 0}
@media (max-width:640px){
  .mhead .full{display:none}
  .mhead .short{display:inline}
  .mcell{min-height:72px;padding:5px 2px;gap:3px;align-items:center;text-align:center}
  .mtop{justify-content:center}
  .hj,.wk,.more{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px}
  .chip{padding:2px}
  .chip span{display:none}
  .dn{width:26px;height:26px;font-size:14px}
}

/* ---------- dialogs ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(14,34,48,.46);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:720px){.ov{align-items:center;padding:24px}}
.dlg{width:min(780px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(8,30,45,.3);display:flex;flex-direction:column;outline:0}
.dlg>header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
.dlg>header h3{margin:0;font-size:17px;font-weight:800;line-height:1.4;display:flex;align-items:center;gap:8px}
.dlg>header h3 .ic{width:20px;height:20px;color:#6b4fd0}
.dlg .body{padding:16px 18px;display:grid;gap:16px}
.dlg>footer{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-top:1px solid var(--line)}
.dlg p{margin:0;line-height:1.7}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.fld label,.lbl2{font-family:"Cairo",sans-serif;font-weight:700;font-size:13px;color:#46606f}
.inp{width:100%;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:#fff;line-height:1.4}
.inp:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 3px #d3ecf9}
textarea.inp{resize:vertical}
.inp.num{width:88px}
select.inp{width:auto;max-width:100%}
.g2,.g3{display:grid;gap:12px}
@media (min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1.3fr .7fr}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.act{display:flex;align-items:center;gap:8px;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:7px 10px;text-align:start;font-family:"Cairo",sans-serif;font-weight:700;font-size:12.5px;line-height:1.35}
.act .ic{width:22px;height:22px}
.act:hover{border-color:#a9d4ea}
.act[aria-pressed="true"]{border-color:var(--blue);background:#eef8fe;box-shadow:0 0 0 2px #cbe9f8}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:36px;border:0;background:#f2f7fa;font-size:18px;font-weight:700}
.stepper span{min-width:42px;text-align:center;font-family:"Cairo",sans-serif;font-weight:800}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input,.dchk input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.check.sm{font-size:13px}
.subtools{display:grid;gap:8px;padding:12px;border-radius:14px;background:#f6f9fb}
.sep{font-family:"Cairo",sans-serif;font-weight:800;font-size:13px;color:#0f7f91;border-top:1px solid var(--line);padding-top:14px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.daysel{display:flex;flex-wrap:wrap;gap:6px}
.dchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13.5px;cursor:pointer;background:#fff}
.logo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px}
.logo-row img{height:44px;width:auto;max-width:120px;object-fit:contain;background:#fff}
.logo-row .inp:not(.num){flex:1 1 160px;width:auto}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px}
.lrow>.inp{flex:1 1 180px;width:auto}
.lrow code{direction:ltr;font-size:12px;background:#f1f6f9;border-radius:6px;padding:2px 6px;color:#46606f}
.arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px}
.arow .name{flex:1 1 200px;width:auto}
.aprev{display:flex;gap:4px;padding:8px;border-radius:12px}
.aprev .ic{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:#173a4d;color:#fff;padding:11px 18px;border-radius:12px;font-family:"Cairo",sans-serif;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .2s ease-out}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
}

/* ---------- zoom, header tools ---------- */
.main{zoom:var(--zoom,1)}
.tools{display:flex;gap:6px;align-items:center}
@media (max-width:760px){.tools .btn .lbl{display:none}}

/* ---------- poster extras ---------- */
.cap.soft{height:auto;min-height:36px;padding:4px 8px;flex-direction:column;gap:0;color:var(--ink2);font-size:13.5px;line-height:1.3;text-align:center}
.cap.soft small{font-family:"Tajawal",sans-serif;font-weight:700;font-size:11.5px;color:#4b6b7c}
.editing .cap[data-act],.editing .cell.dayc[data-act]{cursor:pointer}
.editing .cap[data-act]:hover,.editing .cell.dayc[data-act]:hover{box-shadow:0 0 0 3px #cbe9f8}
.cell.dayc .ev{margin-top:4px;font-family:"Cairo",sans-serif;font-weight:700;font-size:10.5px;color:#5b3fc4;background:#efeafe;border-radius:6px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.offc{flex-direction:row;gap:12px;background:repeating-linear-gradient(135deg,#f6f8fa 0 12px,#eef2f5 12px 24px);border-style:dashed;border-color:#cfd9e0}
.cell.offc .n{font-size:18px;font-weight:800;color:#4d5d68}
.cell.offc .d{color:#5b6b76}
.cell.sel{border-color:#7c5cd6!important;box-shadow:0 0 0 3px #ddd3fb!important;background:#f7f4ff}
.cell.dragging{opacity:.45}
.cell.drop-over{border-color:var(--blue)!important;box-shadow:0 0 0 3px #bfe3f4!important}
@media (prefers-reduced-motion:no-preference){
  .cell.flash{animation:flash 2.6s ease-out}
  @keyframes flash{0%,35%{box-shadow:0 0 0 4px #ffd166;border-color:#f2b31b}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
}
.wk-note{display:inline-block;margin-top:6px;background:#fff4dc;color:#8a5a00;font-family:"Cairo",sans-serif;font-weight:700;font-size:12.5px;border-radius:10px;padding:2px 10px}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:"Cairo",sans-serif;font-weight:700;font-size:11.5px;border-radius:8px;padding:2px 8px;white-space:nowrap}
.tag.hid{background:#fdecec;color:#b3261e}
.tag.ev{background:#efeafe;color:#5b3fc4}
.tag.off{background:#eef2f5;color:#4d5d68}
.banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:500;line-height:1.6}
.banner.ev{background:#f4f0ff;border:1px solid #ddd3fb;color:#3e2a8c}
.banner.off{background:#f3f6f8;border:1px solid #d9e2e8;color:#3e4f5a}
.banner b{font-family:"Cairo",sans-serif}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:8px 10px;box-shadow:0 12px 36px rgba(15,40,60,.2);max-width:calc(100% - 32px)}
.selbar b{font-family:"Cairo",sans-serif;font-size:14px;padding:0 6px}
.btn.on{background:#f1edff;border-color:#b9a9f2;color:#4a33a8}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef3f7;border:1px solid #d6e2ea;border-bottom-width:2px;border-radius:5px;padding:0 5px;direction:ltr;display:inline-block}

/* ---------- simple table ---------- */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
.stbl{width:100%;border-collapse:collapse;min-width:720px}
.stbl th,.stbl td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:10px;text-align:center;vertical-align:middle}
.stbl tr>*:first-child{border-inline-start:0}
.stbl tbody tr:last-child>*{border-bottom:0}
.stbl thead th{background:#f3f8fb;font-family:"Cairo",sans-serif;font-weight:800;font-size:13px;color:#46606f}
.stbl th small{display:block;font-weight:600;color:#6d8594;font-size:11.5px}
.stbl tbody th{background:#f7fbfe;font-family:"Cairo",sans-serif;color:var(--blue-d);font-size:15px;white-space:nowrap}
.stbl .tn{display:flex;align-items:center;justify-content:center;gap:6px;font-family:"Cairo",sans-serif;font-weight:700;font-size:13.5px;color:var(--ink2);line-height:1.4}
.stbl .tn .ic{width:18px;height:18px}
.stbl .td{font-size:12.5px;color:#c93f2c}
.stbl .tt{font-family:"Cairo",sans-serif;font-weight:800;color:#16849b;font-size:12.5px}
.stbl .tm{font-size:12.5px;color:#4a6270;line-height:1.55}
.stbl tr.today th{box-shadow:inset -4px 0 0 var(--blue)}
.stbl td.offt{background:#f6f8fa;color:#4d5d68;font-family:"Cairo",sans-serif;font-weight:700}

/* ---------- all stages ---------- */
.stages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* ---------- assistant ---------- */
.ai-status{border-radius:12px;padding:12px 14px;background:#f4f0ff;border:1px solid #ddd3fb;color:#3e2a8c;line-height:1.7}
.ai-status.err{background:#fdecec;border-color:#f6c9c4;color:#8f1d12}
.chips-ex{display:flex;flex-wrap:wrap;gap:6px}
.chips-ex button{border:1px solid #ddd3fb;background:#faf8ff;color:#4a33a8;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;text-align:start}
.chips-ex button:hover{background:#f1edff}
.notice.ai{background:#f7f4ff;border-color:#ddd3fb}
.notice.ai .ic{color:#6b4fd0}
.notice .grow{flex:1;min-width:200px}
.notice details{margin-top:4px}
.notice summary{cursor:pointer;font-size:13px;color:#4a33a8}
.notice ul{margin:6px 0 0;padding-inline-start:18px;font-size:13px;line-height:1.7}
.notice li.bad{color:#b3261e}
.spin{width:16px;height:16px;border:2.5px solid #cfc6f6;border-top-color:#6b4fd0;border-radius:50%;display:inline-block;vertical-align:-3px;margin-inline-end:8px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.btn.ai{background:#6b4fd0;border-color:#6b4fd0;color:#fff}
.btn.ai:hover:not(:disabled){background:#5a3fc0;border-color:#5a3fc0}

/* ---------- search & settings extras ---------- */
.results{display:grid;gap:6px}
.res{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px;text-align:start;width:100%}
.res:hover{border-color:#9fc9df;background:#f7fbfe}
.res .it{flex:1}
.res small{color:var(--muted);font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;font-family:"Cairo",sans-serif;font-weight:700;font-size:13px}
.sw[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px #cbe9f8}
.sw i{display:flex;border-radius:6px;overflow:hidden}
.sw i b{width:12px;height:22px;display:block}
.radios{display:grid;gap:8px}
.radio{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.sp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px}
.sp-row .it{flex:1 1 200px;line-height:1.5}
details.more summary{cursor:pointer;font-family:"Cairo",sans-serif;font-weight:700;font-size:13px;color:#46606f;padding:2px 0}
details.more{width:100%}
.series{min-height:110px;margin-top:6px}
.g3e{display:grid;gap:12px}
@media (min-width:620px){.g3e{grid-template-columns:repeat(3,1fr)}}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.box h4{margin:0;font-family:"Cairo",sans-serif;font-size:14px}
.box .banner{margin:0}
.box .banner .ic{width:20px;height:20px;flex:0 0 auto}
.steps{margin:0;padding-inline-start:22px;list-style:arabic-indic;display:grid;gap:4px;line-height:1.7}
.dlg>header h3 .ic{color:var(--blue-d)}

  const nw = clone(src); delete nw.title; delete nw.note; delete nw.hidden;
  if(mode !== 'exact'){ advanceSeries(nw); nw.memo = shiftMemo(src.memo); }
  return nw;
}
function usage(){ const u = {}; state.stages.forEach(st => st.weeks.forEach(wk => Object.keys(wk.days).forEach(w => (wk.days[w] || []).forEach(c => { if(c && c.a) u[c.a] = (u[c.a] || 0) + 1; })))); return u; }
function cellInfo(c){
  const a = state.activities[c.a] || {n:'نشاط', i:'star', c:'slate'};
  return {n: c.n || a.n || '', d: c.d || '', t: c.t || a.t || '', i: a.i, c: a.c, i2: a.i2 || '', c2: a.c2 || a.c, r: !!a.r, s: spanOf(c), a: c.a};
}
function memoText(m, w){
  m = m || {}; const v = (m.verses || {})[w];
  return {wird: m.wird || '', line: v ? (m.poem ? m.poem + ': ' : '') + (m.unit || 'البيتان') + ' (' + v + ')' : '', reps: m.reps ? repsText(m.reps) : ''};
}
function viewItems(row, N){ return normRow(row, N).filter(Boolean).map(cellInfo).filter(x => prefs.routine || !x.r); }
/* Topic suggestions for an activity: its series first, then texts already used anywhere. */
function suggestions(actId, field){
  const out = [], seen = new Set(), a = state.activities[actId];
  const add = v => { v = String(v || '').trim(); if(v && !seen.has(v)){ seen.add(v); out.push(v); } };
  if(a && a.series) a.series.forEach(add);
  state.stages.forEach(st => st.weeks.forEach(wk => Object.keys(wk.days).forEach(w => (wk.days[w] || []).forEach(c => { if(c && c.a === actId) add(c[field]); }))));
  return out.slice(0, 80);
}
function seriesField(actId){
  const a = state.activities[actId]; let n = 0, d = 0; if(!a || !a.series.length) return 'd';
  state.stages.forEach(st => st.weeks.forEach(wk => Object.keys(wk.days).forEach(w => (wk.days[w] || []).forEach(c => { if(c && c.a === actId){ if(c.n && a.series.indexOf(c.n) !== -1) n++; if(c.d && a.series.indexOf(c.d) !== -1) d++; } }))));
  return n > d ? 'n' : 'd';
}
function nextTopic(actId, current){
  const a = state.activities[actId]; if(!a || !a.series || !a.series.length) return '';
  const ser = a.series, i = ser.indexOf(current);
  if(i >= 0) return ser[i + 1] || '';
  let max = -1; const st = stageObj();
  st.weeks.slice(0, ui.week + 1).forEach(wk => Object.keys(wk.days).forEach(w => (wk.days[w] || []).forEach(c => { if(c && c.a === actId){ max = Math.max(max, ser.indexOf(c.d || ''), ser.indexOf(c.n || '')); } })));
  return ser[max + 1] || '';
}

/* ================= history & drafts ================= */
function snap(){ const L = state.program.logos; state.program.logos = null; const s = JSON.stringify(state); state.program.logos = L; return s; }
function restoreSnap(s){ const L = state.program.logos; state = normalize(JSON.parse(s)); state.program.logos = L; }
function pushUndo(){ undoStack.push(snap()); if(undoStack.length > 80) undoStack.shift(); redoStack = []; }
function undo(){ const s = undoStack.pop(); if(!s) return; redoStack.push(snap()); restoreSnap(s); ui.sel.clear(); ui.aiNote = null; afterChange(); }
function redo(){ const s = redoStack.pop(); if(!s) return; undoStack.push(snap()); restoreSnap(s); ui.sel.clear(); afterChange(); }
function dirty(){ return JSON.stringify(state) !== savedJSON; }
let draftTimer = 0;
function saveDraftSoon(){ clearTimeout(draftTimer); draftTimer = setTimeout(() => { if(dirty()) store.set('draft', JSON.stringify({pub:null, state})); else store.del('draft'); }, 500); }
function mutate(fn){ pushUndo(); fn(); afterChange(); }
function afterChange(){ if(!state.stages.some(s => s.id === ui.stage)) ui.stage = state.stages[0].id; saveDraftSoon(); render(); }
function checkDraft(){
  const d = safeJSON(store.get('draft')); if(!d){ store.del('draft'); return; }
  if(d.pub && d.pub === state.savedAt){ store.del('draft'); setTimeout(() => toast('تم نشر الجدول، وأصبح ظاهراً لأولياء الأمور.'), 300); return; }
  const strip = o => JSON.stringify(Object.assign({}, o, {savedAt:''}));
  if(!d.state || strip(d.state) === strip(state)){ store.del('draft'); return; }
  ui.draft = d;
}

/* Columns a week fills: trailing columns left empty on every day are not drawn for viewers, so a stage can change its daily slots without losing older weeks. */
function usedCols(st, k){
  const wk = st.weeks[k], N = st.cols; let used = 0;
  state.program.days.forEach(w => { let col = 0; normRow(wk.days[w], N).forEach(c => { const s = spanOf(c); if(c) used = Math.max(used, col + s); col += s; }); });
  return used || N;
}
function colWeights(st, k, N){
  N = N || st.cols;
  const wk = st.weeks[k], L = new Array(N).fill(0);
  state.program.days.forEach(w => { let col = 0; normRow(wk.days[w], N).forEach(c => { const s = spanOf(c); if(c && s === 1){ const x = cellInfo(c); L[col] = Math.max(L[col], x.n.length, x.d.length * 0.92); } col += s; }); });
  return L.map(l => l ? +clamp(l / 17, 0.85, 1.6).toFixed(2) : 1);
}
function themeVars(){
  const t = THEMES[state.program.table.theme] || THEMES.sky;
  return '--pd:' + t.d + ';--pp1:' + t.p1 + ';--pp2:' + t.p2 + ';--pm:' + t.m + ';--pt:' + t.t + ';--tb1:' + t.tb1 + ';--tb2:' + t.tb2 + ';--tbb:' + t.tbb + ';--pst:' + t.st;
}

function cellHTML(c, attrs, cls){

function memoCellHTML(m, w, editing){
  const t = memoText(m, w), empty = !t.wird && !t.line && !t.reps;
  const attrs = editing ? ' data-act="memo" data-w="' + w + '" tabindex="0" role="button" aria-label="تعديل محفوظ ' + DAY_NAMES[w] + '"' : '';
  if(empty) return '<div class="cell memo empty"' + attrs + '>' + (editing ? '<span class="add">+ إضافة</span>' : '') + '</div>';
  return '<div class="cell memo"' + attrs + '>' + (state.program.table.showIcons ? icon('book', 'red') : '') + '<span class="txt">' +
    (t.wird ? '<span class="m1">' + esc(t.wird) + '</span>' : '') + (t.line ? '<span class="m2">' + esc(t.line) + '</span>' : '') + (t.reps ? '<span class="badge">' + esc(t.reps) + '</span>' : '') + '</span></div>';
}
function posterHTML(st, k, editing){
  const wk = st.weeks[k], N = editing ? st.cols : usedCols(st, k), T = state.program.table, memoOn = T.showMemo;
  const tc = '104px ' + colWeights(st, k, N).map(w => 'minmax(0,' + w + 'fr)').join(' ') + (memoOn ? ' minmax(0,1.75fr)' : '');
  let g = '<div class="cap day">' + esc(T.heads.day) + '</div>';
  if(T.colMode === 'banner') g += '<div class="cap prog" style="grid-column:span ' + N + '">' + esc(T.heads.prog) + '</div>';
  else range(N).forEach(i => {
    const h = st.heads[i] || {}, on = T.colMode === 'columns';
    g += '<div class="cap soft" style="background:' + PASTELS[i % PASTELS.length] + '"' + (editing && on ? ' data-act="colhead" data-c="' + i + '" role="button" tabindex="0" aria-label="عنوان العمود ' + toAr(i + 1) + '"' : '') + '>' +
      (on ? esc(h.t || (editing ? 'عمود ' + toAr(i + 1) : '')) + (h.tm ? '<small>' + esc(toAr(h.tm)) + '</small>' : '') : '') + '</div>';
  });
  if(memoOn) g += '<div class="cap memo">' + esc(T.heads.memo) + '</div>';
  state.program.days.forEach(w => {
    const dt = dateOf(k, w), sp = specialFor(dt, st);
    g += '<div class="cell dayc' + (isToday(dt) ? ' now' : '') + '"' + (editing ? ' data-act="daymenu" data-w="' + w + '" role="button" tabindex="0" aria-label="خيارات يوم ' + DAY_NAMES[w] + '"' : '') + '><span>' + DAY_NAMES[w] + '</span>' +
      (T.showDates ? '<small>' + fmt(dt, 'dm') + '</small>' : '') + (sp && sp.k !== 'off' ? '<em class="ev">' + esc(sp.t || 'مناسبة') + '</em>' : '') + '</div>';
    if(sp && sp.k === 'off'){
      g += '<div class="cell offc" style="grid-column:span ' + (N + (memoOn ? 1 : 0)) + '"' + (editing ? ' data-act="special" data-date="' + iso(dt) + '" role="button" tabindex="0"' : '') + '>' + icon('flag', 'slate') + '<span class="txt"><span class="n">' + esc(sp.t || 'إجازة') + '</span>' + (sp.n ? '<span class="d">' + esc(sp.n) + '</span>' : '') + '</span></div>';
      return;
    }
    let col = 0;
    normRow(wk.days[w], N).forEach((c, i) => {
      let cls = '';
      if(ui.flash && ui.flash.has(st.id + '|' + k + '|' + w + '|' + col)) cls += ' flash';
      if(editing && ui.sel.has(w + ':' + i)) cls += ' sel';
      g += cellHTML(c, editing ? ' data-act="cell" data-w="' + w + '" data-i="' + i + '" tabindex="0" role="button"' + (c ? ' draggable="true"' : '') + ' aria-label="خانة ' + DAY_NAMES[w] + ' ' + toAr(col + 1) + '"' : '', cls);
      col += spanOf(c);
    });
    if(memoOn) g += memoCellHTML(wk.memo, w, editing);
  });
  return '<div class="poster" style="min-width:' + (360 + N * 150) + 'px;' + themeVars() + '">' + brandHTML(st, k) + '<div class="pgrid" style="grid-template-columns:' + tc + '">' + g + '</div></div>';
}

function memoCardHTML(m, w){

function mcellHTML(st, dt){
  const w = dt.getDay(), prog = isProgDay(dt), k = locate(dt), wk = weekAt(st, k), sp = specialFor(dt, st);

/* ================= navigation & quick actions ================= */
function setView(v){
  ui.view = v; store.set('view', v);
  if(v === 'week') ui.week = weekFor(ui.date);
  if(v === 'month') ui.month = new Date(ui.date.getFullYear(), ui.date.getMonth(), 1);

}
function goWeek(k){ ui.week = k; ui.date = weekFocusDate(k); ui.sel.clear(); render(); }
function enterEdit(){ ui.edit = true; if(ui.view !== 'week'){ ui.view = 'week'; ui.week = weekFor(ui.date); } render(); }
function exitEdit(){
  const leave = () => { ui.edit = false; ui.sel.clear(); ui.selMode = false; ui.aiNote = null; undoStack = []; redoStack = []; render(); };
  if(!dirty()){ leave(); return; }
  confirmDlg({title:'تعديلات لم تُنشر', text:'أولياء الأمور لن يروا تعديلاتك حتى تنشرها.', ok:'نشر الآن', onOk: publish,
    alt:{label:'تجاهل التعديلات', fn: () => { state = normalize(JSON.parse(savedJSON)); store.del('draft'); leave(); }}});
}
function curWeek(){ const st = stageObj(); return st.weeks[ui.week]; }
function selList(){ return Array.from(ui.sel).map(s => s.split(':').map(Number)).sort((a, b) => a[0] - b[0] || b[1] - a[1]); }
/* Apply fn to each [w, i] in the current week, highest index first so earlier indices stay valid. */
function eachSel(list, fn){ const st = stageObj(), wk = curWeek(); list.slice().sort((a, b) => b[1] - a[1]).forEach(p => { const r = wk.days[p[0]] = normRow(wk.days[p[0]], st.cols); if(p[1] < r.length) fn(r, p[1], p[0]); }); }
function copyCell(w, i){ const st = stageObj(), r = normRow(curWeek().days[w], st.cols); ui.clip = contentOf(r[i]); toast(ui.clip ? 'نُسخت الخانة. استخدم Ctrl+V أو «لصق» لوضعها في خانة أخرى.' : 'نُسخت خانة فارغة.'); render(); }
function pasteTo(list){ if(ui.clip === undefined){ toast('لا توجد خانة منسوخة بعد.'); return; } mutate(() => eachSel(list, (r, i) => setContent(r, i, ui.clip))); }
function clearCells(list){ mutate(() => eachSel(list, (r, i) => putCell(r, i, null))); }
function moveContent(src, dst, copy){
  const st = stageObj(), wk = curWeek();
  const rs = wk.days[src.w] = normRow(wk.days[src.w], st.cols);
  const rd = src.w === dst.w ? rs : (wk.days[dst.w] = normRow(wk.days[dst.w], st.cols));
  const a = contentOf(rs[src.i]), b = contentOf(rd[dst.i]);
  if(copy){ setContent(rd, dst.i, a); return; }
  if(src.w === dst.w){ const hi = Math.max(src.i, dst.i), lo = Math.min(src.i, dst.i); setContent(rs, hi, hi === src.i ? b : a); setContent(rs, lo, lo === src.i ? b : a); }
  else { setContent(rs, src.i, b); setContent(rd, dst.i, a); }
}
function cellNav(el, key){
  const st = stageObj(), wk = curWeek(), w = +el.dataset.w, i = +el.dataset.i, days = state.program.days, r = normRow(wk.days[w], st.cols);
  const focus = (w2, i2) => { const t = $root.querySelector('.cell[data-act="cell"][data-w="' + w2 + '"][data-i="' + i2 + '"]'); if(t) t.focus(); };
  if(key === 'ArrowLeft') return focus(w, Math.min(i + 1, r.length - 1));
  if(key === 'ArrowRight') return focus(w, Math.max(i - 1, 0));
  const di = days.indexOf(w) + (key === 'ArrowDown' ? 1 : -1); if(di < 0 || di >= days.length) return;
  const r2 = normRow(wk.days[days[di]], st.cols), L = locateCol(r2, startOf(r, i));
  focus(days[di], Math.min(L.idx, r2.length - 1));
}

$root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  switch(a){
    case 'stage': ui.stage = b.dataset.id; store.set('stage', ui.stage); ui.week = weekFor(ui.date); ui.sel.clear(); render(); break;
    case 'view': setView(b.dataset.v); break;
    case 'week-prev': goWeek(ui.week - 1); break;
    case 'week-next': goWeek(ui.week + 1); break;
    case 'layout': ui.layout = b.dataset.v; store.set('layout', ui.layout); render(); break;
    case 'all': prefs.all = b.dataset.v === '1'; savePrefs(); render(); break;
    case 'day-prev': ui.date = stepProgDay(ui.date, -1); render(); break;
    case 'day-next': ui.date = stepProgDay(ui.date, 1); render(); break;
    case 'day-today': ui.date = today(); render(); break;
    case 'goday': ui.date = parseISO(b.dataset.date); setView('day'); window.scrollTo(0, 0); break;
    case 'month-prev': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() - 1, 1); render(); break;
    case 'month-next': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + 1, 1); render(); break;
    case 'month-now': { const t = today(); ui.month = new Date(t.getFullYear(), t.getMonth(), 1); render(); break; }
    case 'search': openSearch(); break;
    case 'options': openOptions(); break;
    case 'export': exportPNG(); break;
    case 'csv': saveFile(stageObj().name + '.csv', csvFor(stageObj())); break;
    case 'edit': enterEdit(); break;
    case 'exit-edit': exitEdit(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'ai': openAI(); break;
    case 'ai-note-x': ui.aiNote = null; render(); break;
    case 'settings': openSettings(); break;
    case 'publish': publish(); break;
    case 'cell': {
      const w = +b.dataset.w, i = +b.dataset.i, key = w + ':' + i;
      if(ui.selMode || e.ctrlKey || e.metaKey || e.shiftKey){ if(ui.sel.has(key)) ui.sel.delete(key); else ui.sel.add(key); render(); }
      else openCell(w, i);
      break;
    }
    case 'memo': openMemo(+b.dataset.w); break;
    case 'daymenu': openDayMenu(+b.dataset.w); break;
    case 'colhead': openColHead(+b.dataset.c); break;
    case 'special': openSpecial(b.dataset.date); break;
    case 'week-add': mutate(() => { const st = stageObj(); st.weeks.push(emptyWeek(st.cols)); ui.week = st.weeks.length - 1; }); break;
    case 'weeks-add': openAddWeeks(); break;
    case 'week-copy': openCopyWeek(); break;
    case 'week-props': openWeekProps(); break;
    case 'week-del': delWeek(); break;
    case 'week-show': mutate(() => { delete curWeek().hidden; }); toast('سيظهر هذا الأسبوع لأولياء الأمور بعد «حفظ ونشر».'); break;
    case 'share': openShare(); break;
    case 'col-add': mutate(() => insertColumn(stageObj(), stageObj().cols)); toast('أُضيف عمود في نهاية جدول ' + stageObj().name + '.'); break;
    case 'sel-mode': ui.selMode = !ui.selMode; if(!ui.selMode) ui.sel.clear(); render(); break;
    case 'sel-set': openBulk(); break;
    case 'sel-paste': { const l = selList(); ui.sel.clear(); pasteTo(l); break; }
    case 'sel-clear': { const l = selList(); ui.sel.clear(); clearCells(l); break; }
    case 'sel-none': ui.sel.clear(); render(); break;
    case 'draft-restore': { const d = ui.draft; ui.draft = null; if(d && d.state){ const L = state.program.logos; state = normalize(d.state); if(!state.program.logos.partners.length && !state.program.logos.brand) state.program.logos = L; ui.edit = true; undoStack = []; redoStack = []; render(); toast('استُعيدت تعديلاتك. انشرها ليراها أولياء الأمور.'); } break; }
    case 'draft-drop': ui.draft = null; store.del('draft'); render(); break;
  }
});

/* drag & drop: swap two cells, or copy with Alt/Ctrl */
$root.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.cell[data-act="cell"]'); if(!c || !ui.edit) return;
  ui.drag = {w:+c.dataset.w, i:+c.dataset.i}; c.classList.add('dragging');
  try { e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', 'cell'); } catch(err){}
});
$root.addEventListener('dragover', e => {
  if(!ui.drag) return; const c = e.target.closest('.cell[data-act="cell"]'); if(!c) return;
  e.preventDefault(); try { e.dataTransfer.dropEffect = e.altKey || e.ctrlKey ? 'copy' : 'move'; } catch(err){}
  $root.querySelectorAll('.drop-over').forEach(x => { if(x !== c) x.classList.remove('drop-over'); }); c.classList.add('drop-over');
});
$root.addEventListener('drop', e => {
  if(!ui.drag) return; e.preventDefault();
  const src = ui.drag, c = e.target.closest('.cell[data-act="cell"]'); ui.drag = null;
  if(!c){ render(); return; }
  const dst = {w:+c.dataset.w, i:+c.dataset.i};
  if(src.w === dst.w && src.i === dst.i){ render(); return; }
  ui.sel.clear(); mutate(() => moveContent(src, dst, e.altKey || e.ctrlKey));
});
$root.addEventListener('dragend', () => { ui.drag = null; $root.querySelectorAll('.dragging,.drop-over').forEach(x => x.classList.remove('dragging', 'drop-over')); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $modal.firstChild){ closeModal(); return; }
  if($modal.firstChild) return;
  const mod = e.ctrlKey || e.metaKey, key = String(e.key).toLowerCase(), typing = e.target.closest && e.target.closest('input,textarea,select');
  if(ui.edit && mod && !typing && (key === 'z' || key === 'y')){ e.preventDefault(); if(key === 'y' || e.shiftKey) redo(); else undo(); return; }
  if(ui.edit && e.target.matches && e.target.matches('.cell[data-act="cell"]')){
    const w = +e.target.dataset.w, i = +e.target.dataset.i;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key) !== -1){ e.preventDefault(); cellNav(e.target, e.key); return; }
    if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); ui.focusKey = w + ':' + i; clearCells(ui.sel.size ? selList() : [[w, i]]); ui.sel.clear(); return; }
    if(mod && key === 'c'){ e.preventDefault(); copyCell(w, i); return; }
    if(mod && key === 'v'){ e.preventDefault(); ui.focusKey = w + ':' + i; const l = ui.sel.size ? selList() : [[w, i]]; ui.sel.clear(); pasteTo(l); return; }
  }
  if(ui.edit && e.key === 'Escape' && ui.sel.size){ ui.sel.clear(); render(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ================= dialogs ================= */
let modalClose = null;
function openModal(html, h){

  $modal.innerHTML = '<div class="ov" data-close><div class="dlg" role="dialog" aria-modal="true" tabindex="-1">' + html + '</div></div>';
  $modal.onclick = e => { if(e.target.hasAttribute && e.target.hasAttribute('data-close')) return closeModal(); if(e.target.closest('[data-x="close"]')) return closeModal(); if(h.onclick) h.onclick(e); };
  $modal.oninput = h.oninput || null; $modal.onchange = h.onchange || null; modalClose = h.onclose || null;
  document.body.classList.add('modal-open');
  const dlg = $modal.querySelector('.dlg'); if(dlg) dlg.focus({preventScroll:true});
}
function closeModal(){ if(modalClose){ const f = modalClose; modalClose = null; f(); } $modal.innerHTML = ''; $modal.onclick = $modal.oninput = $modal.onchange = null; document.body.classList.remove('modal-open'); }
function mval(id){ const el = $modal.querySelector('#' + id); return el ? String(el.value || '').trim() : ''; }
function mchk(id){ const el = $modal.querySelector('#' + id); return !!(el && el.checked); }
function head(title){ return '<header><h3>' + title + '</h3><button type="button" class="iconbtn sm" data-x="close" aria-label="إغلاق">' + U('x') + '</button></header>'; }
function confirmDlg(o){
  openModal(head(o.title) + '<div class="body"><p>' + o.text + '</p></div><footer>' +
    '<button type="button" class="btn ' + (o.danger ? 'danger' : 'pri') + '" data-m="ok">' + o.ok + '</button>' +
    (o.alt ? '<button type="button" class="btn warn" data-m="alt">' + o.alt.label + '</button>' : '') +
    '<button type="button" class="btn" data-m="cancel">رجوع</button></footer>', {
    onclick(e){ const b = e.target.closest('[data-m]'); if(!b) return; closeModal(); if(b.dataset.m === 'ok') o.onOk && o.onOk(); else if(b.dataset.m === 'alt') o.alt.fn(); else if(o.onCancel) o.onCancel(); }
  });
}
let toastT = 0;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800);
}
function actButtons(pick){
  return '<button type="button" class="act" data-pick="" aria-pressed="' + (!pick) + '">' + U('x') + '<span>خانة فارغة</span></button>' +
    Object.keys(state.activities).map(id => { const a = state.activities[id]; return '<button type="button" class="act" data-pick="' + esc(id) + '" aria-pressed="' + (pick === id) + '">' + icon(a.i, a.c) + '<span>' + esc(a.n) + '</span></button>'; }).join('');
}
function datalist(id, items){ return '<datalist id="' + id + '">' + items.map(v => '<option value="' + esc(v) + '"></option>').join('') + '</datalist>'; }
function scopeRadios(name, opts, def){ return '<div class="radios">' + opts.map(o => '<label class="radio"><input type="radio" name="' + name + '" value="' + o[0] + '"' + (o[0] === def ? ' checked' : '') + '> ' + o[1] + '</label>').join('') + '</div>'; }
function radioVal(name){ const el = $modal.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; }

/* ----- cell editor ----- */
function openCell(w, i){
  const st = stageObj(), wk = curWeek(); if(!wk) return;
  const row = normRow(wk.days[w], st.cols), c = row[i], start = startOf(row, i), maxSpan = st.cols - start;
  let pick = c ? c.a : '', span = spanOf(c);
  const a0 = state.activities[pick] || {};
  openModal(head('خانة ' + DAY_NAMES[w] + ' · العمود ' + toAr(start + 1)) +
    '<div class="body">' +
      '<div class="fld"><span class="lbl2">النشاط</span><div class="acts">' + actButtons(pick) + '</div></div>' +
      '<div class="g3">' +
        '<div class="fld"><label for="f-n">العنوان</label><input id="f-n" class="inp" list="dl-n" value="' + esc(c && c.n || '') + '" placeholder="' + esc(a0.n || 'اسم النشاط') + '"></div>' +
        '<div class="fld"><label for="f-d">التفاصيل</label><input id="f-d" class="inp" list="dl-d" value="' + esc(c && c.d || '') + '" placeholder="اختياري، مثل: معنى الإيمان بالله"></div>' +
        '<div class="fld"><label for="f-t">الوقت</label><input id="f-t" class="inp" value="' + esc(c && c.t || '') + '" placeholder="' + esc(a0.t ? toAr(a0.t) : 'اختياري') + '"></div>' +
      '</div><span id="dls">' + datalist('dl-n', pick ? suggestions(pick, 'n') : []) + datalist('dl-d', pick ? suggestions(pick, 'd') : []) + '</span>' +
      '<div class="row"><button type="button" class="btn sm" data-next>' + U('chevL') + 'الموضوع التالي في السلسلة</button><span class="muted" id="f-hint"></span></div>' +
      '<div class="row"><span class="lbl2">عرض الخانة</span><div class="stepper"><button type="button" data-span="-1" aria-label="تضييق">−</button><span id="f-s">' + toAr(span) + '</span><button type="button" data-span="1" aria-label="توسيع">+</button></div><span class="muted">من ' + plural(maxSpan, 'عمود واحد', 'عمودين', 'أعمدة', 'عموداً') + ' متاحة</span></div>' +
      '<div class="fld"><span class="lbl2">طبّق على</span>' + scopeRadios('scope', [['one','هذه الخانة فقط'], ['days','هذا العمود في كل أيام الأسبوع'], ['after','نفس الخانة في هذا الأسبوع وما بعده'], ['weeks','نفس الخانة في كل أسابيع المرحلة']], 'one') + '</div>' +
      '<div class="subtools"><span class="lbl2">أدوات</span><div class="row">' +
        '<button type="button" class="btn sm" data-copy>' + U('copy') + 'نسخ الخانة</button>' +
        (ui.clip !== undefined ? '<button type="button" class="btn sm" data-paste>' + U('paste') + 'لصق المنسوخ</button>' : '') +
        '<button type="button" class="btn sm" data-mv="-1"' + (i === 0 ? ' disabled' : '') + '>نقل يميناً</button>' +
        '<button type="button" class="btn sm" data-mv="1"' + (i >= row.length - 1 ? ' disabled' : '') + '>نقل يساراً</button>' +
        '<button type="button" class="btn sm" data-col="add">' + U('plus') + 'عمود بعدها</button>' +
        '<button type="button" class="btn sm warn" data-col="del"' + (st.cols <= 1 ? ' disabled' : '') + '>' + U('trash') + 'حذف العمود</button>' +
      '</div></div>' +
    '</div>' +
    '<footer><button type="button" class="btn pri" data-save>' + U('check') + 'حفظ</button><button type="button" class="btn warn" data-clear>' + U('trash') + 'مسح الخانة</button><button type="button" class="btn" data-x="close">إلغاء</button></footer>', {
    onclick(e){
      const p = e.target.closest('[data-pick]');
      if(p){
        pick = p.dataset.pick;
        $modal.querySelectorAll('[data-pick]').forEach(x => x.setAttribute('aria-pressed', String(x === p)));
        const a = state.activities[pick] || {}, fn = $modal.querySelector('#f-n');
        fn.value = ''; fn.placeholder = a.n || 'اسم النشاط';
        $modal.querySelector('#f-t').placeholder = a.t ? toAr(a.t) : 'اختياري';
        $modal.querySelector('#dls').innerHTML = datalist('dl-n', pick ? suggestions(pick, 'n') : []) + datalist('dl-d', pick ? suggestions(pick, 'd') : []);
        return;
      }
      if(e.target.closest('[data-next]')){
        if(!pick){ $modal.querySelector('#f-hint').textContent = 'اختر النشاط أولاً.'; return; }
        const a = state.activities[pick], useN = mval('f-d') ? false : (mval('f-n') ? true : seriesField(pick) === 'n');
        const nxt = nextTopic(pick, useN ? mval('f-n') : mval('f-d'));
        if(!nxt){ $modal.querySelector('#f-hint').textContent = a && a.series && a.series.length ? 'انتهت مواضيع السلسلة.' : 'لا توجد سلسلة مواضيع لهذا النشاط. أضفها من الإعدادات ← الأنشطة.'; return; }
        $modal.querySelector(useN ? '#f-n' : '#f-d').value = nxt; $modal.querySelector('#f-hint').textContent = '';
        return;
      }
      const sp = e.target.closest('[data-span]');
      if(sp){ span = clamp(span + (+sp.dataset.span), 1, maxSpan); $modal.querySelector('#f-s').textContent = toAr(span); return; }
      if(e.target.closest('[data-copy]')){ ui.clip = contentOf(c); toast('نُسخت الخانة.'); return; }
      if(e.target.closest('[data-paste]')){ const x = ui.clip; if(x){ const b = $modal.querySelector('[data-pick="' + x.a + '"]'); if(b) b.click(); $modal.querySelector('#f-n').value = x.n || ''; $modal.querySelector('#f-d').value = x.d || ''; $modal.querySelector('#f-t').value = x.t || ''; } else { const b = $modal.querySelector('[data-pick=""]'); if(b) b.click(); } return; }
      const mv = e.target.closest('[data-mv]');
      if(mv && !mv.disabled){ const j = i + (+mv.dataset.mv); closeModal(); ui.focusKey = w + ':' + j; mutate(() => { const r = normRow(wk.days[w], st.cols), tmp = r[i]; r[i] = r[j]; r[j] = tmp; wk.days[w] = r; }); return; }
      const col = e.target.closest('[data-col]');
      if(col && !col.disabled){
        closeModal();
        if(col.dataset.col === 'add'){ mutate(() => insertColumn(st, start + spanOf(c))); toast('أُضيف عمود جديد في كل أيام وأسابيع ' + st.name + '.'); }
        else confirmDlg({title:'حذف العمود ' + toAr(start + 1), text:'سيُحذف هذا العمود من كل أيام وأسابيع ' + esc(st.name) + '.', ok:'حذف العمود', danger:true, onOk: () => mutate(() => deleteColumn(st, start))});
        return;
      }
      const save = e.target.closest('[data-save]'), clr = e.target.closest('[data-clear]');
      if(save || clr){
        let cell = null;
        if(save && pick){ cell = {a: pick}; const n = mval('f-n'), d = mval('f-d'), t = mval('f-t'); if(n) cell.n = n; if(d) cell.d = d; if(t) cell.t = t; }
        const scope = radioVal('scope') || 'one', targets = [];
        if(scope === 'one') targets.push([ui.week, w]);
        else if(scope === 'days') state.program.days.forEach(d => targets.push([ui.week, d]));
        else st.weeks.forEach((_, k) => { if(scope === 'weeks' || k >= ui.week) targets.push([k, w]); });
        closeModal(); ui.focusKey = w + ':' + i; ui.flash = new Set();
        mutate(() => targets.forEach(tg => {
          const r = rowOf(st, tg[0], tg[1]), L = locateCol(r, start);
          if(L.idx >= r.length || L.start !== start) return;
          putCell(r, L.idx, cell, cell ? Math.min(span, st.cols - start) : 1);
          ui.flash.add(st.id + '|' + tg[0] + '|' + tg[1] + '|' + start);
        }));
        if(targets.length > 1) toast('طُبّق على ' + plural(targets.length, 'خانة واحدة', 'خانتين', 'خانات', 'خانة') + '.');
      }
    }
  });
}

/* ----- memo editor ----- */
function openMemo(w){
  const st = stageObj(), wk = curWeek(); if(!wk) return;
  const m = wk.memo, vs = clone(m.verses || {}), nums = memoNums(m);
  openModal(head('محفوظ ' + DAY_NAMES[w] + ' · ' + esc(weekTitle(st, ui.week))) +
    '<div class="body">' +
      '<div class="fld"><label for="m-v">مقدار الحفظ لهذا اليوم</label><input id="m-v" class="inp" value="' + esc(vs[w] || '') + '" placeholder="مثال: ١ - ٢"></div>' +
      '<div class="sep">إعدادات تنطبق على كل أيام هذا الأسبوع</div>' +
      '<div class="fld"><label for="m-wird">نص الورد</label><input id="m-wird" class="inp" value="' + esc(m.wird || '') + '" placeholder="مثال: الورد القرآني حسب الخطة الشخصية لكل طالب"></div>' +
      '<div class="g3">' +
        '<div class="fld"><label for="m-poem">المتن أو المنظومة</label><input id="m-poem" class="inp" value="' + esc(m.poem || '') + '" placeholder="مثال: المنظومة البيضاء"></div>' +
        '<div class="fld"><label for="m-unit">وحدة الحفظ</label><input id="m-unit" class="inp" value="' + esc(m.unit || 'البيتان') + '"></div>' +
        '<div class="fld"><label for="m-reps">مرات التكرار</label><input id="m-reps" class="inp" inputmode="numeric" value="' + esc(m.reps || '') + '" placeholder="مثال: ٢٠"></div>' +
      '</div>' +
      '<div class="subtools"><span class="lbl2">ترقيم كل أيام الأسبوع تلقائياً</span><div class="row">' +
        '<label class="mini">يبدأ من <input id="m-start" class="inp num" inputmode="numeric" value="' + toAr(nums.length ? Math.min.apply(null, nums) : 1) + '"></label>' +
        '<label class="mini">لكل يوم <input id="m-step" class="inp num" inputmode="numeric" value="' + toAr(2) + '"></label>' +
        '<button type="button" class="btn sm" data-auto>تعبئة الأيام</button>' +
      '</div><p class="help" id="m-prev"></p></div>' +
      '<label class="check"><input type="checkbox" id="m-all"> طبّق إعدادات الورد والمتن والتكرار على كل أسابيع ' + esc(st.name) + '</label>' +
    '</div>' +
    '<footer><button type="button" class="btn pri" data-save>' + U('check') + 'حفظ المحفوظ</button><button type="button" class="btn" data-x="close">إلغاء</button></footer>', {
    onclick(e){
      if(e.target.closest('[data-auto]')){
        let n = parseInt(fromAr(mval('m-start')), 10) || 1; const step = clamp(parseInt(fromAr(mval('m-step')), 10) || 1, 1, 50);
        state.program.days.forEach(d => { vs[d] = step > 1 ? toAr(n) + ' - ' + toAr(n + step - 1) : toAr(n); n += step; });
        $modal.querySelector('#m-v').value = vs[w] || '';
        $modal.querySelector('#m-prev').textContent = state.program.days.map(d => DAY_NAMES[d] + ' (' + vs[d] + ')').join('، ');
        return;
      }
      if(e.target.closest('[data-save]')){
        vs[w] = mval('m-v');
        const base = {wird: mval('m-wird'), poem: mval('m-poem'), unit: mval('m-unit') || 'البيتان', reps: mval('m-reps')}, all = mchk('m-all');
        const verses = {}; Object.keys(vs).forEach(d => { if(vs[d]) verses[d] = vs[d]; });
        closeModal();
        mutate(() => { wk.memo = Object.assign({}, base, {verses}); if(all) st.weeks.forEach(x => { if(x !== wk) Object.assign(x.memo, base); }); });
      }
    }
  });
}

/* ----- day options ----- */
function openDayMenu(w){
  const st = stageObj(), k = ui.week, dt = dateOf(k, w), sp = state.special[iso(dt)];
  openModal(head('يوم ' + DAY_NAMES[w] + ' · ' + fmt(dt, 'dmy')) +
    '<div class="body">' +
      '<div class="box"><h4>نسخ برنامج هذا اليوم</h4><div class="daysel">' + state.program.days.filter(d => d !== w).map(d => '<label class="dchk"><input type="checkbox" data-to="' + d + '"><span>' + DAY_NAMES[d] + '</span></label>').join('') + '</div>' +
        scopeRadios('dscope', [['week','في هذا الأسبوع فقط'], ['after','في هذا الأسبوع وما بعده'], ['all','في كل أسابيع المرحلة']], 'week') +
        '<div><button type="button" class="btn sm pri" data-dcopy>' + U('copy') + 'نسخ</button></div></div>' +
      '<div class="box"><h4>إجازة أو مناسبة</h4>' + (sp ? '<p>' + (sp.k === 'off' ? 'إجازة' : 'مناسبة') + ': <b>' + esc(sp.t || '') + '</b></p>' : '<p class="muted">لا يوجد شيء خاص في هذا التاريخ.</p>') +
        '<div><button type="button" class="btn sm" data-dspecial>' + U('flag') + (sp ? 'تعديل' : 'تعيين إجازة أو مناسبة') + '</button></div></div>' +
      '<div class="box"><h4>مسح</h4><div><button type="button" class="btn sm warn" data-dclear>' + U('trash') + 'مسح كل خانات هذا اليوم</button></div></div>' +
    '</div><footer><button type="button" class="btn" data-x="close">إغلاق</button></footer>', {
    onclick(e){
      if(e.target.closest('[data-dcopy]')){
        const to = Array.from($modal.querySelectorAll('[data-to]:checked')).map(x => +x.dataset.to);
        if(!to.length){ toast('اختر يوماً واحداً على الأقل.'); return; }
        const scope = radioVal('dscope'), weeks = st.weeks.map((_, i) => i).filter(i => scope === 'all' || (scope === 'after' ? i >= k : i === k));
        closeModal();
        mutate(() => weeks.forEach(i => { const src = normRow(st.weeks[i].days[w], st.cols); to.forEach(d => { st.weeks[i].days[d] = clone(src); }); }));
        toast('نُسخ برنامج ' + DAY_NAMES[w] + ' إلى ' + plural(to.length * weeks.length, 'يوم واحد', 'يومين', 'أيام', 'يوماً') + '.');
        return;
      }
      if(e.target.closest('[data-dspecial]')){ openSpecial(iso(dt)); return; }
      if(e.target.closest('[data-dclear]')){ closeModal(); mutate(() => { st.weeks[k].days[w] = new Array(st.cols).fill(null); }); }
    }
  });
}

/* ----- special days ----- */
function openSpecial(date, back){
  const sp = state.special[date] || {k:'off', t:'', n:'', s:[]}, exists = !!state.special[date];
  openModal(head(exists ? 'تعديل يوم خاص' : 'إجازة أو مناسبة') +
    '<div class="body">' +
      '<div class="g2"><div class="fld"><label for="sp-d">التاريخ</label><input id="sp-d" type="date" class="inp" value="' + esc(date || iso(ui.date)) + '"></div>' +
      '<div class="fld"><span class="lbl2">النوع</span>' + scopeRadios('spk', [['off','إجازة: لا يوجد برنامج'], ['event','مناسبة: يبقى البرنامج مع تنبيه']], sp.k) + '</div></div>' +
      '<div class="fld"><label for="sp-t">العنوان</label><input id="sp-t" class="inp" value="' + esc(sp.t || '') + '" placeholder="مثال: إجازة نهاية الأسبوع المطوّلة، أو حفل الختام"></div>' +
      '<div class="fld"><label for="sp-n">ملاحظة لأولياء الأمور</label><input id="sp-n" class="inp" value="' + esc(sp.n || '') + '" placeholder="اختياري"></div>' +
      '<div class="fld"><span class="lbl2">المراحل</span><div class="daysel">' + state.stages.map(s => '<label class="dchk"><input type="checkbox" data-sps="' + esc(s.id) + '"' + (!sp.s || !sp.s.length || sp.s.indexOf(s.id) !== -1 ? ' checked' : '') + '><span>' + esc(s.name) + '</span></label>').join('') + '</div></div>' +
    '</div><footer><button type="button" class="btn pri" data-save>' + U('check') + 'حفظ</button>' + (exists ? '<button type="button" class="btn warn" data-del>' + U('trash') + 'حذف</button>' : '') + '<button type="button" class="btn" data-x="close">إلغاء</button></footer>', {
    onclick(e){
      const done = () => { if(back) renderSettings(); };
      if(e.target.closest('[data-del]')){ closeModal(); mutate(() => { delete state.special[date]; }); done(); return; }
      if(e.target.closest('[data-save]')){
        const d = mval('sp-d'); if(!isISO(d)){ toast('اختر تاريخاً صحيحاً.'); return; }
        const ss = Array.from($modal.querySelectorAll('[data-sps]')).filter(x => x.checked).map(x => x.dataset.sps);
        if(!ss.length){ toast('اختر مرحلة واحدة على الأقل.'); return; }
        const rec = {k: radioVal('spk') || 'off', t: mval('sp-t'), n: mval('sp-n'), s: ss.length === state.stages.length ? [] : ss};
        closeModal(); mutate(() => { if(date && date !== d) delete state.special[date]; state.special[d] = rec; }); done();
      }
    }
  });
}

function openSearch(){
  let scope = 'stage';
  openModal(head('بحث في الجدول') + '<div class="body"><input id="q" class="inp" placeholder="اكتب اسم نشاط أو موضوع، مثل: قصة موسى" autocomplete="off">' +
    '<div class="seg small" role="group" aria-label="نطاق البحث"><button type="button" data-sc="stage" aria-pressed="true">' + esc(stageObj().name) + '</button><button type="button" data-sc="all" aria-pressed="false">كل المراحل</button></div>' +
    '<div id="res" class="results"><p class="muted">ابدأ الكتابة لتظهر النتائج.</p></div></div>', {
    oninput(){ run(); },
    onclick(e){
      const sc = e.target.closest('[data-sc]'); if(sc){ scope = sc.dataset.sc; $modal.querySelectorAll('[data-sc]').forEach(x => x.setAttribute('aria-pressed', String(x === sc))); run(); return; }
      const r = e.target.closest('[data-go]'); if(r){ ui.stage = r.dataset.st; store.set('stage', ui.stage); ui.date = parseISO(r.dataset.go); closeModal(); setView('day'); }
    }
  });
  const q = $modal.querySelector('#q'); if(q) q.focus();
  function run(){
    const box = $modal.querySelector('#res'), term = normAr(mval('q')); if(!box) return;
    if(term.length < 2){ box.innerHTML = '<p class="muted">اكتب حرفين على الأقل.</p>'; return; }
    const out = [];
    (scope === 'all' ? state.stages : [stageObj()]).forEach(st => st.weeks.forEach((wk, k) => {
      if(!weekAt(st, k)) return;
      state.program.days.forEach(w => {
        const dt = dateOf(k, w), hits = normRow(wk.days[w], st.cols).filter(Boolean).map(cellInfo).filter(x => normAr(x.n + ' ' + x.d).indexOf(term) !== -1);
        const mt = memoText(wk.memo, w); if(normAr(mt.line).indexOf(term) !== -1) hits.push({n: mt.line, d:'', i:'book', c:'red'});
        hits.forEach(x => out.push({st, k, w, dt, x}));
      });
    }));
    Object.keys(state.special).forEach(d => { const sp = state.special[d]; if(normAr(sp.t + ' ' + sp.n).indexOf(term) !== -1) out.push({st: stageObj(), k: locate(parseISO(d)), w: parseISO(d).getDay(), dt: parseISO(d), x:{n: sp.t, d: sp.k === 'off' ? 'إجازة' : 'مناسبة', i:'flag', c:'purple'}}); });
    if(!out.length){ box.innerHTML = '<p class="muted">لا توجد نتائج.</p>'; return; }
    box.innerHTML = out.slice(0, 60).map(o => '<button type="button" class="res" data-go="' + iso(o.dt) + '" data-st="' + esc(o.st.id) + '"><span class="ib" style="background:' + tint(o.x.c) + '">' + icon(o.x.i, o.x.c) + '</span><span class="it"><b>' + esc(o.x.n) + '</b>' + (o.x.d ? ' · ' + esc(o.x.d) : '') + '<br><small>' + DAY_NAMES[o.w] + ' ' + fmt(o.dt, 'dmy') + ' · ' + esc(weekTitle(o.st, o.k)) + (scope === 'all' ? ' · ' + esc(o.st.name) : '') + '</small></span></button>').join('') +
      (out.length > 60 ? '<p class="muted">تظهر أول ٦٠ نتيجة.</p>' : '');
  }
}

function setPath(obj, path, v){ const ks = path.split('.'); let o = obj; for(let i = 0; i < ks.length - 1; i++){ o = o[ks[i]]; if(o == null) return; } o[ks[ks.length - 1]] = v; }

function settingsInput(e){

  if(el.dataset && el.dataset.series){ touchSettings(); state.activities[el.dataset.series].series = el.value.split('\n').map(s => s.trim()).filter(Boolean); saveDraftSoon(); return; }
  if(el.dataset && el.dataset.head != null){ touchSettings(); const st = stageObj(), i = +el.dataset.head; while(st.heads.length <= i) st.heads.push({}); st.heads[i][el.dataset.hf] = el.value; saveDraftSoon(); return; }
  if(!el.dataset || !el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date') return;
  touchSettings(); setPath(state, el.dataset.bind, readBind(el)); saveDraftSoon();

function settingsChange(e){
  const el = e.target;
  if(el.id === 's-file') return onLogoFile(el);
  if(el.id === 's-import') return onImport(el);
  if(el.dataset.series || el.dataset.head != null){ afterChange(); return; }
  if(el.dataset.colmode){ touchSettings(); state.program.table.colMode = el.dataset.colmode; afterChange(); renderSettings(); return; }
  if(el.dataset.day != null){
    const d = +el.dataset.day, set = new Set(state.program.days);
    if(el.checked) set.add(d); else set.delete(d);
    if(!set.size){ el.checked = true; toast('اختر يوماً واحداً على الأقل.'); return; }
    touchSettings(); state.program.days = Array.from(set).sort((a, b) => a - b); afterChange(); return;
  }
  if(!el.dataset.bind) return;
  const v = readBind(el);
  if(el.dataset.bind === 'program.startDate' && !isISO(v)) return;
  touchSettings(); setPath(state, el.dataset.bind, v);
  if(el.dataset.bind === 'program.startDate') ui.week = weekFor(ui.date);
  afterChange();
  if(el.hasAttribute('data-re')) renderSettings();
}
function settingsClick(e){
  const t = e.target.closest('[data-tab]'); if(t){ setTab = t.dataset.tab; renderSettings(); const d = $modal.querySelector('.dlg'); if(d) d.scrollTop = 0; return; }
  const th = e.target.closest('[data-theme]'); if(th){ touchSettings(); state.program.table.theme = th.dataset.theme; afterChange(); renderSettings(); return; }
  const lg = e.target.closest('[data-logo]'); if(lg){ logoTarget = lg.dataset.logo; $modal.querySelector('#s-file').click(); return; }
  const ld = e.target.closest('[data-logo-del]'); if(ld){ const k = ld.dataset.logoDel, L = state.program.logos; if(k === 'brand') L.brand = ''; else L.partners.splice(+k.slice(1), 1); afterChange(); renderSettings(); return; }
  const sb = e.target.closest('[data-st]'); if(sb && !sb.disabled){ stageAction(sb.dataset.st, +sb.dataset.i); return; }
  const ad = e.target.closest('[data-actdel]'); if(ad && !ad.disabled){ touchSettings(); delete state.activities[ad.dataset.actdel]; afterChange(); renderSettings(); return; }
  if(e.target.closest('[data-actadd]')){
    touchSettings(); const id = 'a' + Date.now().toString(36);
    state.activities[id] = {n:'نشاط جديد', i:'star', c:'blue', series:[]}; afterChange(); renderSettings();
    const inp = $modal.querySelector('[data-bind="activities.' + id + '.n"]'); if(inp){ inp.scrollIntoView({block:'center'}); inp.focus(); inp.select(); }
    return;
  }
  const se = e.target.closest('[data-sp-edit]'); if(se){ openSpecial(se.dataset.spEdit, true); return; }
  const sd = e.target.closest('[data-sp-del]'); if(sd){ touchSettings(); delete state.special[sd.dataset.spDel]; afterChange(); renderSettings(); return; }
  if(e.target.closest('[data-sp-new]')){ openSpecial('', true); return; }
  const bk = e.target.closest('[data-bk]');
  if(bk && !bk.disabled){
    if(bk.dataset.bk === 'csv') saveFile(stageObj().name + '.csv', csvFor(stageObj()));
    else if(bk.dataset.bk === 'json') saveFile('نسخة ' + state.program.title + ' ' + iso(today()) + '.json', JSON.stringify(state));
    else $modal.querySelector('#s-import').click();
  }
}
function stageAction(kind, i){
  const S = state.stages;
  if(kind === 'up' || kind === 'down'){ const j = kind === 'up' ? i - 1 : i + 1; touchSettings(); const tmp = S[i]; S[i] = S[j]; S[j] = tmp; afterChange(); renderSettings(); }
  else if(kind === 'dup'){ touchSettings(); const c = clone(S[i]); c.id = 'st' + Date.now().toString(36); c.name = S[i].name + ' (نسخة)'; S.splice(i + 1, 0, c); afterChange(); renderSettings(); }
  else if(kind === 'add'){ touchSettings(); S.push({id: 'st' + Date.now().toString(36), name:'مرحلة جديدة', cols:5, heads:[], weeks:[emptyWeek(5)]}); afterChange(); renderSettings(); }
  else if(kind === 'del'){
    confirmDlg({title:'حذف ' + esc(S[i].name), text:'ستُحذف المرحلة بكل أسابيعها. يمكنك التراجع قبل النشر.', ok:'حذف المرحلة', danger:true,
      onOk: () => { touchSettings(); S.splice(i, 1); afterChange(); renderSettings(); }, onCancel: renderSettings});
  }
}
function readLogo(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w0 = img.naturalWidth || 700, h0 = img.naturalHeight || 700, sc = Math.min(1, 700 / Math.max(w0, h0));
        const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0 * sc)); cv.height = Math.max(1, Math.round(h0 * sc));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        try { res(cv.toDataURL('image/png')); } catch(err){ rej(err); }
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function onLogoFile(el){
  const f = el.files && el.files[0]; el.value = ''; if(!f) return;
  try {
    const src = await readLogo(f), L = state.program.logos;
    if(logoTarget === 'brand') L.brand = src;
    else if(logoTarget === 'new') L.partners.push({src, alt:'', h:86});
    else if(L.partners[+String(logoTarget).slice(1)]) L.partners[+String(logoTarget).slice(1)].src = src;
    afterChange(); renderSettings();
  } catch(err){ toast('تعذّرت قراءة الصورة. جرّب ملف PNG أو JPG.'); }
}
function onImport(el){
  const f = el.files && el.files[0]; el.value = ''; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const obj = safeJSON(fr.result);
    if(!obj || !Array.isArray(obj.stages) || !obj.program){ toast('الملف ليس نسخة احتياطية صالحة لهذا الجدول.'); return; }
    confirmDlg({title:'استعادة النسخة الاحتياطية', text:'سيُستبدل الجدول الحالي بمحتوى الملف (' + plural(obj.stages.length, 'مرحلة واحدة', 'مرحلتان', 'مراحل', 'مرحلة') + '). يمكنك التراجع قبل النشر.', ok:'استعادة',
      onOk: () => { pushUndo(); state = normalize(obj); ui.week = 0; afterChange(); toast('استُعيدت النسخة. انشرها ليراها أولياء الأمور.'); }, onCancel: renderSettings});
  };
  fr.readAsText(f);
}

    const code = e && e.code;
    state.savedAt = prev; ui.saving = false;
    store.set('draft', JSON.stringify({pub:null, state}));
    if(code === 'conflict'){ toast('نُشرت نسخة أحدث قبل حفظك. ستُحدَّث الصفحة ويمكنك استعادة تعديلاتك.'); return; }
    if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(code) !== -1){ ui.canEdit = false; ui.edit = false; toast('حسابك يستطيع عرض الجدول فقط، ولا يستطيع نشره.'); }
    else if(code === 'too_large') toast('حجم الصفحة كبير. صغّر الشعارات أو احذف بعضها ثم أعد النشر.');
    else if(code === 'rate_limited') toast('نشرت أكثر من مرة خلال وقت قصير. انتظر دقيقة ثم أعد المحاولة.');
    else toast('تعذّر النشر الآن. حاول مرة أخرى بعد لحظات.');
    render();
  }
}
async function saveFile(name, data){
  if(!ui.downloads){ toast('تنزيل الملفات غير متاح في هذا العرض.'); return; }
  try { await ui.downloads.save({filename: name, data}); }
  catch(e){
    const code = e && e.code;
    if(code === 'declined') return;
    if(['unavailable','not_granted','capability_disabled','capability_removed'].indexOf(code) !== -1){ ui.downloads = null; render(); toast('تنزيل الملفات غير متاح في هذا العرض.'); }
    else if(code === 'rate_limited') toast('هناك نافذة تنزيل مفتوحة. أكملها ثم أعد المحاولة.');
    else toast('تعذّر حفظ الملف.');
  }
}
function csvRows(st, publishedOnly){
  const N = st.cols, rows = [];
  const hd = ['الأسبوع', 'التاريخ', 'اليوم']; range(N).forEach(i => hd.push((st.heads[i] && st.heads[i].t) || ('العمود ' + (i + 1)))); hd.push('المحفوظ'); rows.push(hd);
  st.weeks.forEach((wk, k) => {
    if(publishedOnly ? (!wk || wk.hidden) : !weekAt(st, k)) return;
    state.program.days.forEach(w => {
      const dt = dateOf(k, w), sp = specialFor(dt, st), line = [weekTitle(st, k), iso(dt), DAY_NAMES[w]];
      if(sp && sp.k === 'off'){ line.push('إجازة: ' + (sp.t || '')); range(N - 1).forEach(() => line.push('')); }
      else normRow(wk.days[w], N).forEach(c => { const s = spanOf(c); line.push(c ? (x => x.n + (x.d ? ' - ' + x.d : '') + (x.t ? ' (' + x.t + ')' : ''))(cellInfo(c)) : ''); for(let j = 1; j < s; j++) line.push(''); });
      const mt = memoText(wk.memo, w); line.push([mt.line, mt.reps].filter(Boolean).join(' · '));
      rows.push(line);
    });
  });
  return rows;
}
function csvText(rows){ return '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function csvFor(st){ return csvText(csvRows(st)); }
function csvAll(){
  const maxN = Math.max.apply(null, state.stages.map(s => s.cols));
  const out = [['المرحلة', 'الأسبوع', 'التاريخ', 'اليوم'].concat(range(maxN).map(i => 'العمود ' + (i + 1)), ['المحفوظ'])];
  state.stages.forEach(st => csvRows(st, true).slice(1).forEach(r => { const mid = r.slice(0, -1); while(mid.length < 3 + maxN) mid.push(''); out.push([st.name].concat(mid, [r[r.length - 1]])); }));
  return csvText(out);
}
function loadScript(src){ return new Promise((res, rej) => { if(window.html2canvas) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function posterBlob(el){
  try {
    await loadScript(H2C);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(el, {scale:2, backgroundColor:'#ffffff', logging:false, windowWidth: Math.max(el.scrollWidth + 80, 1280),
      onclone: doc => doc.querySelectorAll('.poster').forEach(x => { x.classList.add('snap'); x.querySelectorAll('.now').forEach(n => n.classList.remove('now')); x.querySelectorAll(':scope > html2canvaspseudoelement').forEach(n => n.remove()); })});
    return await new Promise(r => canvas.toBlob(r, 'image/png'));
  } catch(e){ return null; }
}
async function exportPNG(){
  const el = document.querySelector('.poster'); if(!el || !ui.downloads) return;
  toast('جارٍ تجهيز صورة الجدول…');
  const blob = await posterBlob(el);
  if(!blob){ toast('تعذّر تجهيز الصورة في هذا المتصفح.'); return; }
  saveFile(stageObj().name + ' - ' + weekTitle(stageObj(), ui.week) + '.png', blob);
}
/* Every stage's poster for week k, drawn off-screen one at a time; draft weeks are left out. */
async function exportAllPNG(k){
  if(!ui.downloads){ toast('تنزيل الملفات غير متاح في هذا العرض.'); return; }
  const list = state.stages.filter(st => st.weeks[k] && !st.weeks[k].hidden);
  if(!list.length){ toast('هذا الأسبوع مخفي في كل المراحل.'); return; }
  const box = document.createElement('div');
  box.setAttribute('aria-hidden', 'true');
  box.style.cssText = 'position:absolute;top:0;left:-20000px;width:1400px;direction:rtl';
  document.body.appendChild(box);
  let done = 0;
  try {
    for(let i = 0; i < list.length; i++){
      const st = list[i];
      toast('جارٍ تجهيز صورة ' + st.name + ' (' + toAr(i + 1) + ' من ' + toAr(list.length) + ')…');
      box.innerHTML = posterHTML(st, k, false);
      const blob = await posterBlob(box.firstElementChild);
      if(!blob){ toast('تعذّر تجهيز الصورة في هذا المتصفح.'); break; }
      await saveFile(st.name + ' - ' + weekTitle(st, k) + '.png', blob);
      if(!ui.downloads) break;
      done++;
    }
  } finally { box.remove(); }
  if(done === list.length) toast('اكتملت صور ' + weekName(k) + ' لكل المراحل.');
}

/* ================= start ================= */
if(DEV) checkDraft();
render();
(function connect(){
  const cl = window.claude;
  if(!cl || typeof cl.use !== 'function') return;
  cl.use('downloads').then(d => { if(d){ ui.downloads = d; render(); } }).catch(() => {});
  Promise.all([cl.use('artifact'), cl.use('user')].map(p => Promise.resolve(p).catch(() => null))).then(async r => {
    const art = r[0], usr = r[1];
    ui.artifact = art;
    let can = false;
    if(art && usr){ try { can = await usr.canEdit(); } catch(e){ can = false; } }
    ui.canEdit = !!can;
    if(ui.canEdit){
      checkDraft(); render();
      cl.use('sample').then(s => { if(s){ ui.sample = s; render(); } }).catch(() => {});
    }
  });
})();
})();
